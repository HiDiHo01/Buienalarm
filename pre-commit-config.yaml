repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0  # Use any version >=5,<7 if you want the latest from that range
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff import sorting (locked Poetry environment)
        entry: poetry run ruff check --select I --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff formatting (locked Poetry environment)
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pycqa/flake8
    rev: 4.0.1
    hooks:
      - id: flake8
