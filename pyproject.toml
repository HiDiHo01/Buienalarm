[tool.poetry]
name = "Buienalarm"
version = "2026.5.5"
description = "Buienalarm"
authors = ["HiDiHo <hidiho@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "custom_components/buienalarm" }
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short --color=yes"

[tool.poetry.dependencies]
python = ">=3.14.2,<3.15"
homeassistant = { version = ">=2026.1", allow-prereleases = false }

[tool.poetry.group.dev.dependencies]
ruff = "0.16.9"
pylint = "^4.0.0"

[tool.ruff]
required-version = "==0.16.9"
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
split-on-trailing-comma = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
