# Track implementation of the Home Assistant Integration Quality Scale.
# Statuses are intentionally conservative: "done" means verified in the current
# repository, "todo" means not yet demonstrated, and "exempt" includes a reason.
# Reference: https://developers.home-assistant.io/docs/core/integration-quality-scale/

rules:
  action-setup:
    status: exempt
    comment: "Buienalarm does not register service actions."
  appropriate-polling: todo
  brands: todo
  common-modules: todo
  config-flow-test-coverage: todo
  config-flow: todo
  dependency-transparency:
    status: done
  docs-actions:
    status: exempt
    comment: "The integration does not provide service actions."
  docs-triggers:
    status: exempt
    comment: "The integration does not provide device or event triggers."
  docs-conditions:
    status: exempt
    comment: "The integration does not provide conditions."
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup: todo
  entity-unique-id: todo
  has-entity-name: todo
  runtime-data: done
  test-before-configure: todo
  test-before-setup: todo
  unique-config-entry: todo

  action-exceptions:
    status: exempt
    comment: "There are no service actions that can raise action-specific failures."
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: "The integration accesses a public forecast endpoint and has no authentication flow."
  test-coverage: todo

  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: "The integration uses configured geographic coordinates, not discovered device/network information."
  discovery:
    status: exempt
    comment: "The integration represents a forecast service for a configured location; there is no discoverable physical device."
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: "Buienalarm is a cloud forecast service, not an integration for physical devices."
  docs-supported-functions: todo
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: "Each configured location creates a fixed set of forecast entities; the service does not add physical devices dynamically."
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: "The integration does not discover or track physical devices that can become stale."

  async-dependency:
    status: exempt
    comment: "The integration has no external Python library dependency for its I/O; it uses Home Assistant's aiohttp session directly."
  inject-websession:
    status: exempt
    comment: "There is no external API client dependency to inject a web session into; the integration uses Home Assistant's shared aiohttp session directly."
  strict-typing: todo
