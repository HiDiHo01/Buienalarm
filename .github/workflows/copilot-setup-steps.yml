name: Copilot Setup Steps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Prepare Python development environment
    runs-on: ubuntu-latest
    container: python:3.14.2
    timeout-minutes: 10
    steps:
      - name: Install integration and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio pytest-homeassistant-custom-component black pylint
