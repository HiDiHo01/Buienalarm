name: Copilot Setup Steps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Prepare Python development environment
    runs-on: ubuntu-latest
    container: python:3.14.2
    timeout-minutes: 10
    steps:
      - name: Install integration and development dependencies
        run: |
          python -m pip install --only-binary=:all: "poetry==2.3.2"
          poetry check --lock
          poetry config virtualenvs.create false --local
          poetry install --no-interaction --no-ansi --no-root --only main,dev
