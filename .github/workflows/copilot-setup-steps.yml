name: Copilot Setup Steps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Prepare Python development environment
    runs-on: ubuntu-latest
    container: python:3.14.2
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install integration and development dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
          POETRY_INSTALLER_NO_BINARY: "pyric,mock-open"
        run: |
          python -m pip install --only-binary=:all: "poetry==2.3.2"
          poetry check --lock
          poetry env use python
          poetry install --no-interaction --no-ansi --no-root --only main,dev
          poetry --project test_dependencies check --lock
          poetry --project test_dependencies env use python
          poetry --project test_dependencies install --no-interaction --no-ansi --no-root
