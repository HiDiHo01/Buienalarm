name: Link Jules session to PR

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: read

jobs:
  link-session:
    runs-on: ubuntu-latest
    steps:
      - name: Identify PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR #${PR_NUMBER}: ${PR_TITLE}"
