name: Live API integration test

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: Latitude to test
        required: true
        default: "52.3676"
        type: string
      longitude:
        description: Longitude to test
        required: true
        default: "4.9041"
        type: string

permissions:
  contents: read

jobs:
  live-api-test:
    name: Test integration against live Buienalarm data
    runs-on: ubuntu-latest
    container: python:3.14.2
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install integration and test dependencies
        run: |
          python -m pip install --only-binary=:all: "poetry==2.3.2"
          poetry check --lock
          poetry config virtualenvs.create false --local
          poetry install --no-interaction --no-ansi --no-root --only main,dev

      - name: Run live API integration test
        env:
          BUIENALARM_LIVE_TEST: "1"
          BUIENALARM_TEST_LATITUDE: ${{ inputs.latitude }}
          BUIENALARM_TEST_LONGITUDE: ${{ inputs.longitude }}
        run: python -m pytest -v -s tests/test_live_api.py
