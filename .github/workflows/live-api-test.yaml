name: Live API integration test

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: Latitude to test
        required: true
        default: "52.3676"
        type: string
      longitude:
        description: Longitude to test
        required: true
        default: "4.9041"
        type: string

permissions:
  contents: read

jobs:
  live-api-test:
    name: Test integration against live Buienalarm data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: 3.14.2

      - name: Install integration and test dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
          POETRY_INSTALLER_NO_BINARY: "pyric,mock-open"
        run: |
          python -m pip install --only-binary=:all: "poetry==2.3.2"
          poetry check --lock
          poetry env use python
          poetry install --no-interaction --no-ansi --no-root --only main,dev
          poetry --project test_dependencies check --lock
          poetry --project test_dependencies env use python
          poetry --project test_dependencies install --no-interaction --no-ansi --no-root

      - name: Run live API integration test
        env:
          BUIENALARM_LIVE_TEST: "1"
          BUIENALARM_TEST_LATITUDE: ${{ inputs.latitude }}
          BUIENALARM_TEST_LONGITUDE: ${{ inputs.longitude }}
        run: poetry --project test_dependencies run pytest -v -s tests/test_live_api.py
