name: Home Assistant Buienalarm Custom Integration CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"

      - name: Install the pinned formatter
        shell: bash
        run: |
          ruff_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["tool"]["poetry"]["group"]["dev"]["dependencies"]["ruff"])')"
          python -m pip install --only-binary=:all: "ruff==$ruff_version"

      - name: Verify formatter version consistency
        run: python .github/scripts/check_formatter_versions.py

      - name: Check formatting
        id: ruff_check
        run: |
          python -m ruff check --select I --diff .
          python -m ruff format --check --diff .

      - name: Prepare formatting patch
        id: ruff_patch
        if: failure() && steps.ruff_check.outcome == 'failure'
        shell: bash
        run: |
          python -m ruff check --select I --fix .
          python -m ruff format .
          git diff --binary -- '*.py' '*.pyi' > "$RUNNER_TEMP/ruff-formatting.patch"
          echo 'Download the ruff-formatting-patch artifact, review it, and apply it to the checked PR head with git apply.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload formatting patch
        if: failure() && steps.ruff_patch.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ruff-formatting-patch
          path: ${{ runner.temp }}/ruff-formatting.patch
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14.2"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned Poetry CLI
        run: |
          python -m pip install --only-binary=:all: "poetry==2.3.2"

      - name: ⚙️ Configure Poetry environment
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
          # PyRIC has no wheel; the isolated test environment also needs mock-open.
          POETRY_INSTALLER_NO_BINARY: "pyric,mock-open"
        run: |
          poetry check --lock
          poetry env use "${{ matrix.python-version }}"
          poetry install --no-interaction --no-ansi --no-root

      - name: Install isolated regression-test baseline
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
          POETRY_INSTALLER_NO_BINARY: "pyric,mock-open"
        run: |
          poetry --project test_dependencies check --lock
          poetry --project test_dependencies env use "${{ matrix.python-version }}"
          poetry --project test_dependencies install --no-interaction --no-ansi --no-root

      - name: 🧠 Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/Buienalarm" >> $GITHUB_ENV

      - name: Set up configuration
        run: |
          mkdir -p ./config
          cat > ./config/configuration.yaml <<'EOF'
          homeassistant:
            name: Test
          logger:
            default: warning
            logs:
              custom_components.buienalarm: debug
          EOF

      - name: Check HA config validity
        run: poetry run hass --script check_config --config ./config
        env:
          HASS_CONFIG: ./config

      - name: 🧪 Run tests with debug logging
        run: |
          mkdir -p debug-logs
          set -o pipefail
          poetry --project test_dependencies run pytest -vv \
            --log-cli-level=DEBUG \
            --log-file=debug-logs/pytest-debug.log \
            --log-file-level=DEBUG \
            --color=yes --tb=long \
            2>&1 | tee debug-logs/pytest-console.log
        shell: bash

      - name: ⬆️ Upload test debug logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-debug-logs
          path: debug-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: 📦 Build integration package
        run: poetry build

      - name: ⬆️ Upload Package / built wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buienalarm-package
          path: dist/*.whl
