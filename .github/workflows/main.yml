name: Home Assistant Buienalarm Custom Integration CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14.2"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned Poetry CLI
        run: |
          python -m pip install --only-binary=:all: "poetry==2.3.2"

      - name: ⚙️ Configure Poetry environment
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
          # These two locked test dependencies only provide source distributions.
          POETRY_INSTALLER_NO_BINARY: "pyric,mock-open"
        run: |
          poetry check --lock
          poetry env use "${{ matrix.python-version }}"
          poetry install --no-interaction --no-ansi --no-root

      - name: 🧠 Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/Buienalarm" >> $GITHUB_ENV

      - name: Set up configuration
        run: |
          mkdir -p ./config
          cat > ./config/configuration.yaml <<'EOF'
          homeassistant:
            name: Test
          logger:
            default: warning
            logs:
              custom_components.buienalarm: debug
          EOF

      - name: Check HA config validity
        run: poetry run hass --script check_config --config ./config
        env:
          HASS_CONFIG: ./config

      - name: 🧪 Run tests with debug logging
        run: |
          mkdir -p debug-logs
          set -o pipefail
          poetry run pytest -vv \
            --log-cli-level=DEBUG \
            --log-file=debug-logs/pytest-debug.log \
            --log-file-level=DEBUG \
            --color=yes --tb=long \
            2>&1 | tee debug-logs/pytest-console.log
        shell: bash

      - name: ⬆️ Upload test debug logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-debug-logs
          path: debug-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: 🎨 Format code (Black)
        run: poetry run black .

      - name: 📦 Build integration package
        run: poetry build

      - name: ⬆️ Upload Package / built wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buienalarm-package
          path: dist/*.whl
