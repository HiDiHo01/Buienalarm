name: Home Assistant Buienalarm Custom Integration CI
permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14.2"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🧰 Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: ⚙️ Configure Poetry environment
        run: |
          poetry lock
          poetry env use "${{ matrix.python-version }}"
          poetry install --no-interaction --no-ansi

      - name: 🧠 Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/Buienalarm" >> $GITHUB_ENV

      - name: Set up configuration
        run: |
          mkdir -p ./config
          cat > ./config/configuration.yaml <<'EOF'
          homeassistant:
            name: Test
          logger:
            default: warning
            logs:
              custom_components.buienalarm: debug
          EOF

      - name: Check HA config validity
        run: poetry run hass --script check_config --config ./config
        env:
          HASS_CONFIG: ./config

      - name: 🧪 Run tests with debug logging
        run: |
          mkdir -p debug-logs
          set -o pipefail
          poetry run pytest -vv \
            --log-cli-level=DEBUG \
            --log-file=debug-logs/pytest-debug.log \
            --log-file-level=DEBUG \
            --color=yes --tb=long \
            2>&1 | tee debug-logs/pytest-console.log
        shell: bash

      - name: ⬆️ Upload test debug logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-debug-logs
          path: debug-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: 🎨 Format code (Black)
        run: poetry run black .

      - name: 📦 Build integration package
        run: poetry build

      - name: ⬆️ Upload Package / built wheel
        uses: actions/upload-artifact@v7  # Update van v3 naar v4
        with:
          name: buienalarm-package
          path: dist/*.whl
